<svg xmlns="http://www.w3.org/2000/svg" class="pcb-placement-preview" viewBox="0 0 28 18" width="28mm" height="18mm" data-board="board:0" data-board-name="Regression" data-units="mm">
  <style>
    .board-background{fill:#f8faf8}
    .board-outline{fill:#d7ead0;stroke:#1f5f3a;stroke-width:0.28}
    .board-feature{fill:none;stroke:#6b7280;stroke-width:0.24}
    .pcb-track{fill:none;stroke:#b45309;stroke-linecap:round;stroke-linejoin:round}
    .pcb-via-annular{fill:#b45309;stroke:#7c2d12;stroke-width:0.08}
    .pcb-via-drill{fill:#f8faf8;stroke:#7c2d12;stroke-width:0.06}
    .board-text{font-family:sans-serif;fill:#172026;text-anchor:middle;dominant-baseline:middle}
    .board-feature-label,.reference-designator,.pad-net-label,.diagnostic-label{font:1.8px sans-serif;fill:#172026}
    .footprint-courtyard{fill:none;stroke:#64748b;stroke-width:0.12;stroke-dasharray:0.7 0.45}
    .footprint-body.declared{fill:#fff8db;stroke:#8a6a16;stroke-width:0.18}
    .footprint-fabrication.declared{fill:none;stroke:#475569;stroke-width:0.1}
    .footprint-assembly.declared{fill:none;stroke:#7c3aed;stroke-width:0.1;stroke-dasharray:0.55 0.35}
    .footprint-marking.declared{fill:#172026;fill-opacity:0.45;stroke:#172026;stroke-width:0.08}
    .footprint-marking.kind-pin_1,.footprint-marking.kind-polarity{fill:#b42318;stroke:#7a271a}
    .footprint-envelope.synthetic{fill:#fff8db;fill-opacity:0.24;stroke:#8a6a16;stroke-width:0.18;stroke-dasharray:0.9 0.55}
    .footprint-pad{fill:#d99822;stroke:#5a3a08;stroke-width:0.14}
    .pad-overlay{fill:#175cd3;stroke:#ffffff;stroke-width:0.12}
    .ratsnest{fill:none;stroke:#175cd3;stroke-width:0.16;stroke-dasharray:0.8 0.55}
    .diagnostic-marker{fill:none;stroke:#b42318;stroke-width:0.28;stroke-dasharray:0.9 0.55}
    .diagnostic-label{fill:#b42318}
  </style>
  <rect class="board-background" x="0" y="0" width="28" height="18"/>
  <g class="board-content" transform="translate(4 4)">
    <polygon class="board-outline" data-board="board:0" points="0,0 20,0 20,10 0,10"/>
    <g class="layer layer-board-features">
    </g>
    <g id="pcb-layer-F_Cu" class="pcb-layer board-layer layer-F_Cu" data-layer="board_layer:0" data-layer-name="F.Cu" data-layer-role="copper" data-layer-side="top">
    <g class="layer layer-copper">
      <polyline id="pcb-track-0" class="pcb-track" data-track="board_track:0" data-layer="board_layer:0" data-net="net:0" points="5.25,5 5.25,2 13.25,2 13.25,5" stroke-width="0.25"/>
      <polyline id="pcb-track-1" class="pcb-track" data-track="board_track:1" data-layer="board_layer:0" data-net="net:1" points="6.75,5 6.75,8 14.75,8 14.75,5" stroke-width="0.25"/>
    </g>
    <g class="layer layer-board-text">
    </g>
    </g>
    <g id="pcb-layer-B_Cu" class="pcb-layer board-layer layer-B_Cu" data-layer="board_layer:1" data-layer-name="B.Cu" data-layer-role="copper" data-layer-side="bottom">
    <g class="layer layer-copper">
    </g>
    <g class="layer layer-board-text">
    </g>
    </g>
    <g id="pcb-layer-F_SilkS" class="pcb-layer board-layer layer-F_SilkS" data-layer="board_layer:2" data-layer-name="F.SilkS" data-layer-role="silkscreen" data-layer-side="top">
    <g class="layer layer-copper">
    </g>
    <g class="layer layer-board-text">
      <text id="pcb-text-0" class="board-text" data-text="board_text:0" data-layer="board_layer:2" x="8" y="1.5" font-size="0.6" transform="rotate(0 8 1.5)">REV A</text>
    </g>
    </g>
    <g class="layer layer-footprints">
      <g class="layer layer-package-courtyards">
      <polygon class="footprint-courtyard declared" data-placement="component_placement:0" data-component="component:0" points="4.75,4.3 7.25,4.3 7.25,5.7 4.75,5.7"/>
      <polygon class="footprint-courtyard declared" data-placement="component_placement:1" data-component="component:1" points="12.75,4.3 15.25,4.3 15.25,5.7 12.75,5.7"/>
      </g>
      <g class="layer layer-package-bodies">
      <polygon class="footprint-body declared" data-placement="component_placement:0" data-component="component:0" points="5.2,4.6 6.8,4.6 6.8,5.4 5.2,5.4"/>
      <polygon class="footprint-body declared" data-placement="component_placement:1" data-component="component:1" points="13.2,4.6 14.8,4.6 14.8,5.4 13.2,5.4"/>
      </g>
      <g class="layer layer-package-fabrication">
      <polygon class="footprint-fabrication declared" data-placement="component_placement:0" data-component="component:0" points="5.2,4.6 6.8,4.6 6.8,5.4 5.2,5.4"/>
      <polygon class="footprint-fabrication declared" data-placement="component_placement:1" data-component="component:1" points="13.2,4.6 14.8,4.6 14.8,5.4 13.2,5.4"/>
      </g>
      <g class="layer layer-package-assembly">
      <polygon class="footprint-assembly declared" data-placement="component_placement:0" data-component="component:0" points="5.2,4.6 6.8,4.6 6.8,5.4 5.2,5.4"/>
      <polygon class="footprint-assembly declared" data-placement="component_placement:1" data-component="component:1" points="13.2,4.6 14.8,4.6 14.8,5.4 13.2,5.4"/>
      </g>
      <g class="layer layer-silkscreen">
      </g>
      <g class="layer layer-pads">
      <g class="component-placement top" data-placement="component_placement:0" data-component="component:0" data-footprint-def="footprint_def:0" data-footprint="passives:R_0603_1608Metric" transform="translate(6 5) rotate(0)">
        <rect class="footprint-pad rounded-rectangle connected" data-pad-projection="pcb_pad:0:0" data-pad="footprint_pad:0" data-pin="pin:0" data-net="net:0" x="-1.15" y="-0.475" width="0.8" height="0.95" rx="0.1" ry="0.1"/>
        <rect class="footprint-pad rounded-rectangle connected" data-pad-projection="pcb_pad:0:1" data-pad="footprint_pad:1" data-pin="pin:1" data-net="net:1" x="0.35" y="-0.475" width="0.8" height="0.95" rx="0.1" ry="0.1"/>
      </g>
      <g class="component-placement top" data-placement="component_placement:1" data-component="component:1" data-footprint-def="footprint_def:0" data-footprint="passives:R_0603_1608Metric" transform="translate(14 5) rotate(0)">
        <rect class="footprint-pad rounded-rectangle connected" data-pad-projection="pcb_pad:1:0" data-pad="footprint_pad:0" data-pin="pin:2" data-net="net:0" x="-1.15" y="-0.475" width="0.8" height="0.95" rx="0.1" ry="0.1"/>
        <rect class="footprint-pad rounded-rectangle connected" data-pad-projection="pcb_pad:1:1" data-pad="footprint_pad:1" data-pin="pin:3" data-net="net:1" x="0.35" y="-0.475" width="0.8" height="0.95" rx="0.1" ry="0.1"/>
      </g>
      </g>
      <g class="layer layer-reference-designators">
      <text class="reference-designator" data-placement="component_placement:0" data-component="component:0" x="6" y="3.3" text-anchor="middle">R1</text>
      <text class="reference-designator" data-placement="component_placement:1" data-component="component:1" x="14" y="3.3" text-anchor="middle">R2</text>
      </g>
    </g>
    <g class="layer layer-pad-overlays">
    </g>
    <g class="layer layer-diagnostics">
    </g>
  </g>
</svg>
